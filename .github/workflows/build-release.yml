name: Build Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (leave empty to build current branch)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ inputs.tag || github.sha }}
      build_normal_ipa: true
      build_trollstore_tipa: true
      build_jailbroken_ipa: false

