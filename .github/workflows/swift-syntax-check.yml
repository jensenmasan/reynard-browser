name: Swift Syntax Check

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  parse:
    name: Parse Swift sources
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse Swift files
        shell: bash
        run: |
          set -e
          fail=0
          count=0
          find browser extensions -name '*.swift' > /tmp/files.txt
          while IFS= read -r file; do
            count=$((count + 1))
            if ! swiftc -parse "$file" 2>/tmp/err.txt; then
              echo "::error file=$file::syntax error"
              cat /tmp/err.txt
              fail=1
            fi
          done < /tmp/files.txt
          echo "Parsed $count Swift files."
          exit $fail

  javascript:
    name: Check JavaScript sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check bundled add-on scripts
        shell: bash
        run: |
          set -e
          find extensions -name '*.js' > /tmp/files.txt
          while IFS= read -r file; do
            node --check "$file"
            echo "OK $file"
          done < /tmp/files.txt

      - name: Validate add-on manifests
        shell: bash
        run: |
          set -e
          find extensions -name 'manifest.json' > /tmp/manifests.txt
          while IFS= read -r file; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
            echo "OK $file"
          done < /tmp/manifests.txt
